name: Publish a versioned release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, no leading v), e.g. 1.2.3'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Tag and Release
    steps:
      - name: Validate version
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '${{ github.event.inputs.version }}' is not a valid semver (X.Y.Z, no leading v)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Tag release
        run: |
          VERSION="${{ github.event.inputs.version }}"
          MAJOR="${VERSION%%.*}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "v$VERSION"
          git tag -f "v$MAJOR"

          git push origin "v$VERSION"
          git push origin "v$MAJOR" --force

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ github.event.inputs.version }}" --title "v${{ github.event.inputs.version }}" --generate-notes
