name: CI
on: [ push, pull_request ]
jobs:
  Build:

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        node-version: [ 24 ]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run all
    - name: Check bundle
      run: |
        if [ -n "$(git status --porcelain release-issue pull-request-quality weekly-notes setup)" ]; then
          echo "::error::Committed bundles are out of date. Run 'npm run build' and commit the result."
          git status --porcelain release-issue pull-request-quality weekly-notes setup
          git --no-pager diff -- release-issue pull-request-quality weekly-notes setup
          exit 1
        fi
