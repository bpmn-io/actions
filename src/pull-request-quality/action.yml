name: 'Validate pull request quality'
description: 'Enforce pull request quality checks, including required template headers, checklist items, and clean commit history'
inputs:
  token:
    description: 'GITHUB_TOKEN or a repository-scoped token with contents: read and pull-requests: read, used to read the template and pull request commits'
    default: ${{ github.token }}
  template-path:
    description: 'Optional repository-relative pull request template path, tried before .github/PULL_REQUEST_TEMPLATE.md in the consumer repository and bpmn-io/.github'
    required: false
    default: ''
  check-uses-template:
    description: 'Require the pull request body to contain every header of the template'
    required: false
    default: 'true'
  check-checklist-preserved:
    description: 'Require every template checklist item to remain in the pull request body (checked or unchecked)'
    required: false
    default: 'true'
  check-screenshot-media:
    description: 'Require inline screenshot or video media when the template "Screenshots added" item is checked'
    required: false
    default: 'true'
  check-clean-history:
    description: 'Require a cleaned-up history without merge, fixup, squash, or work-in-progress commits and with at most 50 commits'
    required: false
    default: 'true'
  check-conventional-commits:
    description: 'Require every non-merge commit subject to follow the Conventional Commits format'
    required: false
    default: 'true'
  check-closes-statement:
    description: 'Warn when no commit body closes an issue (for example "Closes #123"); never fails the check'
    required: false
    default: 'true'
outputs:
  valid:
    description: 'Whether every enabled, gating check passed'
  template-url:
    description: 'URL of the discovered template, if one exists'
  checks:
    description: 'JSON map of check id to { valid, message? } for checks that ran, or { status: "skipped" } for disabled or inapplicable checks'
runs:
  using: 'node24'
  main: 'index.js'
